name: Sector rotation independent money-share research
on:
  pull_request:
    paths:
      - 'diagnostics/sector-rotation-independent-research.mjs'
      - 'diagnostics/sector-rotation-independent-research.test.mjs'
      - 'diagnostics/official-eod-history-probe.mjs'
      - 'diagnostics/official-eod-history-probe.test.mjs'
      - 'diagnostics/official-sector-pp-two-day.mjs'
      - 'diagnostics/sector-industry-map-20261029.json'
      - '.github/workflows/qa-sector-rotation-research.yml'
permissions:
  contents: read
jobs:
  verify-share-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify paired turnover-share flow and RS 50/10 calculations
        run: node --test diagnostics/sector-rotation-independent-research.test.mjs diagnostics/official-eod-history-probe.test.mjs
      - name: Compare official traded-value sector shares for two real days
        run: node diagnostics/official-sector-pp-two-day.mjs
