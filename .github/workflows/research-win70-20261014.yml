name: Winrate vs return historical research (one-time)
on:
  push:
    branches:
      - research-bear-market-backtest-20261014
    paths:
      - research/win70_exit_backtest.py
permissions:
  contents: write
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Replay identical entries with different exits
        run: python3 research/win70_exit_backtest.py
      - name: Save result to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin research-bear-market-backtest-20261014
          git add research/win70_exit_results.json
          git diff --cached --quiet || (git commit -m "Research: same-entry winrate profit tradeoff" && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win70-exit-research
          path: research/win70_exit_results.json
          if-no-files-found: warn
