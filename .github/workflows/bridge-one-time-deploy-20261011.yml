name: One-time Cloudflare bridge deployment check

# One-off path-restricted push trigger. Do not schedule recurring deployments.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridge-one-time-deploy-20261011.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check whether Cloudflare has been authorized in GitHub
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Cloudflare deploy credentials are not configured in GitHub Actions; no deployment attempted."
            exit 1
          fi
          echo "Cloudflare GitHub Actions credentials are configured; values remain hidden."
      - uses: actions/checkout@v4
      - name: Deploy existing bridge using authorized credentials
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-bridge
          command: deploy
      - name: Verify the live Worker version and protected endpoints
        shell: bash
        run: |
          set -euo pipefail
          URL="https://asheng-market-bridge.home588885.workers.dev"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "$URL/health" -o /tmp/asheng-health.json
          node -e 'const h=require("/tmp/asheng-health.json"); if(h.ok!==true||h.service!=="asheng-market-bridge"||h.deployment_marker!=="admin-auth-market-bridge-20261010"||h.eod_prefilter_route!=="read_only_available") process.exit(1)'
          for PATH_TO_CHECK in "quotes?symbols=2330:tse" "eod-prefilter?market=tse"; do
            STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$URL/$PATH_TO_CHECK")"
            if [ "$STATUS" != "401" ]; then
              echo "::error::Expected anonymous access denial 401, got $STATUS for $PATH_TO_CHECK"
              exit 1
            fi
          done
          echo "PASS: official Worker version & unauthenticated routes checked"
