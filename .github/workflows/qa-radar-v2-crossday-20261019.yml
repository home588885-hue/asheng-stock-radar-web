name: Radar V2 Cross-day Read-only QA
on:
  push:
    paths:
      - ".github/workflows/qa-radar-v2-crossday-20261019.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar-v2-crossday:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Regression-gate validation (zero S/C network calls)
        run: node diagnostics/radar-regression-gates.js
      - name: Mobile/desktop V2 group render and cross-day dedup (zero network calls)
        run: XC_EXPORT_PREVIEW=1 node diagnostics/entry-simplified-qa-20261019.js
      - name: Verified-orange trial ACK outbox (read-only local simulation)
        run: node diagnostics/trial-ack-outbox-qa-20261019.js
      - name: Night-before research shortlist safely selects newest signed V2 without fake buys
        run: XC_EXPORT_RESEARCH_PREVIEW=1 node diagnostics/entry-night-research-qa-20261019.js
      - name: Install isolated test browser
        run: |
          pip install --disable-pip-version-check --no-input playwright
          python -m playwright install --with-deps chromium
      - name: Check mobile/desktop group overflow and expand-collapse
        run: python diagnostics/entry-simplified-browser-qa-20261019.py
      - name: Click full research stocks on mobile and desktop
        run: python diagnostics/night-research-browser-qa-20261019.py
# One-time rerun after adding the non-trading evening research panel.
# Revalidate overnight shortlist reason labels and newest-v2-only controls.
# Verify mobile/desktop expand-collapse after research card fixture fix.
# Manual QA refresh 2026-10-22: verify consistent compact/expanded status and KD-high guard. Zero C/S scans.
