name: Clean Up Disposable Taiching C Photo Worker

on:
  push:
    branches: [main]
    paths: [.github/workflows/taiching-c-photo-probe-cleanup.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Direct Cloudflare API deletion of ONLY isolated photo probe
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,os,datetime
          from pathlib import Path
          token=os.getenv('CLOUDFLARE_API_TOKEN','')
          account=os.getenv('CLOUDFLARE_ACCOUNT_ID','')
          name='asheng-taiching-photo-probe-20261017'
          out={'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
               'target':name,'stock_worker_touched':False,'deleted':False,
               'method':'direct Cloudflare Workers scripts API'}
          if not account or not token:out['error']='missing_credentials'
          else:
              url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{name}'
              req=urllib.request.Request(url,method='DELETE',headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      out['http_status']=r.status
                      body=r.read(4000)
                      obj=json.loads(body) if body else {'success':True}
                      out['deleted']=bool(obj.get('success',False))
                      out['errors']=[{'code':e.get('code')} for e in obj.get('errors',[])]
              except urllib.error.HTTPError as ex:
                  out['http_status']=ex.code
                  try:
                      j=json.loads(ex.read(2000))
                      out['errors']=[{'code':e.get('code'),'message':str(e.get('message',''))[:130]} for e in j.get('errors',[])]
                  except Exception:out['error_type']='HTTPError'
                  if ex.code==404:out['deleted']=True
              except Exception as ex:out['error_type']=type(ex).__name__
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/taiching-c-probe-cleanup.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['deleted']:raise SystemExit('Cloudflare probe deletion not confirmed')
          PY
      - name: Save sanitized cleanup report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path='diagnostics/taiching-c-probe-cleanup.json';
            if(!fs.existsSync(path)){core.setFailed('No cleanup report generated');return;}
            const owner=context.repo.owner,repo=context.repo.repo,content=fs.readFileSync(path).toString('base64');
            for(let i=0;i<3;i++){
              let sha;try{const r=await github.rest.repos.getContent({owner,repo,path});if(!Array.isArray(r.data))sha=r.data.sha;}catch(e){if(e.status!==404)throw e;}
              try{await github.rest.repos.createOrUpdateFileContents({owner,repo,path,sha,content,branch:context.ref.replace('refs/heads/',''),message:'Record isolated photo C Worker cleanup [skip ci]'});break}
              catch(e){if(i===2||![409,422].includes(e.status))throw e}
            }
