name: Repair full-radar TWSE calendar once (2026-10-27)
on:
  push:
    paths:
      - ".github/workflows/repair-full-radar-calendar-20261027.yml"
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Correct shared EOD and quote dates in formal admin UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          start='      const quoteSessionDate = () => {'
          end='      const validTodayQuote ='
          i=s.index(start);j=s.index(end,i)
          assert 850 < j-i < 1900, 'quote calendar source drifted'
          calendar="""      // Shared official 2026 TWSE calendar, including 10/23 typhoon closure.
                // Model dates and C quote session dates must not drift after long holidays.
                const TWSE_CLOSED_2026 = new Set([
                  '2026-01-01','2026-02-12','2026-02-13','2026-02-16','2026-02-17',
                  '2026-02-18','2026-02-19','2026-02-20','2026-02-27','2026-04-03',
                  '2026-04-06','2026-05-01','2026-06-19','2026-09-25','2026-09-28',
                  '2026-10-09','2026-10-23','2026-10-26','2026-12-25'
                ]);
                const isTWSEClosedDate = date => date.getUTCDay() === 0 || date.getUTCDay() === 6
                  || TWSE_CLOSED_2026.has(date.toISOString().slice(0,10));
                const previousValidTWSESession = (date, includeCurrentDate) => {
                  const result = new Date(date.getTime());
                  if(!includeCurrentDate)result.setUTCDate(result.getUTCDate()-1);
                  while(isTWSEClosedDate(result))result.setUTCDate(result.getUTCDate()-1);
                  return result;
                };
                const quoteSessionDate = () => {
                  const parts = new Intl.DateTimeFormat('en-CA', {
                    timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit',
                    hour:'2-digit', minute:'2-digit', hourCycle:'h23'
                  }).formatToParts(new Date());
                  const v = Object.fromEntries(parts.map(part => [part.type, part.value]));
                  const d = new Date(Date.UTC(Number(v.year), Number(v.month)-1, Number(v.day)));
                  const minutes = Number(v.hour || 0) * 60 + Number(v.minute || 0);
                  const session = previousValidTWSESession(d, minutes>=540);
                  return session.toISOString().slice(0,10).replace(/-/g,'');
                };
          """
          s=s[:i]+calendar+s[j:]
          guard="String(quote.quote_date || '').replace(/[^0-9]/g,'') === quoteSessionDate()"
          assert s.count(guard)==1, 'freshness guard drifted'
          s=s.replace(guard,"String(quote.quote_date || '').replace(/[^0-9]/g,'') === todayQuoteDate()",1)
          start='      const expectedSignalDataDate = () => {'
          end='      // Display only:'
          i=s.index(start);j=s.index(end,i)
          assert 1000 < j-i < 3200, 'EOD date source drifted'
          expected="""      const expectedSignalDataDate = () => {
                const parts = new Intl.DateTimeFormat('en-CA', {
                  timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit',
                  day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
                }).formatToParts(new Date());
                const v = Object.fromEntries(parts.map(part => [part.type, part.value]));
                const current = new Date(Date.UTC(Number(v.year), Number(v.month)-1,Number(v.day)));
                const minutes = Number(v.hour || 0) * 60 + Number(v.minute || 0);
                // C is real-time, S daily candles refresh at the existing 21:00 batch.
                return previousValidTWSESession(current, minutes>=1260)
                  .toISOString().slice(0,10);
              };
          """
          s=s[:i]+expected+s[j:]
          p.write_text(s,encoding='utf-8')
          print('Shared full-radar date logic corrected, no trading rule changed')
          PY
      - name: Six 2026 typhoon holiday/session regression cases
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const text=fs.readFileSync('admin.html','utf8');
          const extract=(a,b)=>text.slice(text.indexOf(a),text.indexOf(b,text.indexOf(a)));
          const code=extract('      const TWSE_CLOSED_2026', '      const validTodayQuote =')
            +extract('      const expectedSignalDataDate = () => {','      // Display only:')
            +'\nresult=[expectedSignalDataDate(),quoteSessionDate()]';
          const cases=[
            ['2026-10-23T02:00:00Z','2026-10-22','20261022'],
            ['2026-10-26T02:00:00Z','2026-10-22','20261022'],
            ['2026-10-27T00:30:00Z','2026-10-22','20261022'],
            ['2026-10-27T02:00:00Z','2026-10-22','20261027'],
            ['2026-10-27T06:00:00Z','2026-10-22','20261027'],
            ['2026-10-27T13:30:00Z','2026-10-27','20261027']
          ];
          for(const [when,e,q] of cases){
            const FakeDate=class extends Date{constructor(...a){super(...(a.length?a:[when]))}};
            const env={Date:FakeDate,Intl,Set,Object,Number,String};
            vm.runInNewContext(code,env);
            assert.deepEqual([...env.result],[e,q],when);
          }
          assert.ok(text.includes("=== todayQuoteDate()"),'no old session quote as current');
          console.log('PASS six EOD and live quote source-date checks');
          JS
      - name: Full-radar existing regression gates
        run: |
          node diagnostics/radar-regression-gates.js
          XC_EXPORT_PREVIEW=1 node diagnostics/entry-simplified-qa-20261019.js
          node diagnostics/trial-ack-outbox-qa-20261019.js
          XC_EXPORT_RESEARCH_PREVIEW=1 node diagnostics/entry-night-research-qa-20261019.js
          git diff --check
      - name: Publish only the verified common UI fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then echo 'No change to publish'; exit 0; fi
          git commit -m "fix: shared TWSE session, C trade and EOD model date across all three radar zones"
          git push
