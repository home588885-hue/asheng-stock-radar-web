name: Holding Risk A Unit Tests (read only)
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/asheng-holding-risk-a.mjs'
      - 'diagnostics/holding-risk-policy-a-20261029.test.mjs'
      - 'supabase/functions/spring-swallow-holdings/index.ts'
      - 'diagnostics/legacy-holdings-auth-20261029.test.mjs'
      - 'supabase/functions/spring-swallow-analyze/index.ts'
      - 'supabase/functions/spring-swallow-picks/index.ts'
      - 'diagnostics/holding-risk-policy-a-source-contract-20261029.test.mjs'
      - 'diagnostics/deno-legacy-risk-check.json'
      - '.github/workflows/qa-holding-risk-a.yml'

permissions:
  contents: read

jobs:
  risk-a-pure-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pure alert evaluator (no API calls, no scans)
        run: node --test diagnostics/holding-risk-policy-a-20261029.test.mjs diagnostics/legacy-holdings-auth-20261029.test.mjs diagnostics/holding-risk-policy-a-source-contract-20261029.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile-check legacy secured handler only
        run: deno check supabase/functions/spring-swallow-holdings/index.ts
      - name: Parse and transpile legacy analyzers without executing scans
        run: npx --yes esbuild@0.25.12 supabase/functions/spring-swallow-analyze/index.ts supabase/functions/spring-swallow-picks/index.ts --format=esm --platform=neutral --outdir=/tmp/asheng-risk-qa --log-level=error
