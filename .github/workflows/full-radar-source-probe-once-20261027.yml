name: Full radar 2026-10-27 source probe (read-only)
on:
  push:
    paths:
      - ".github/workflows/full-radar-source-probe-once-20261027.yml"
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check Cloudflare, TWSE / TPEx trades and FinMind candle dates
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,datetime
          from zoneinfo import ZoneInfo
          root='https://qexbtubfoyfsllaiecvv.supabase.co/functions/v1/'
          def get(label,url,timeout=45):
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'AshengRadarReadOnlyHealth/1.0'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  data=json.load(r)
                  print(label,'http',r.status,'ok',data.get('ok'),'source',data.get('source'))
                  return data
          c=get('Cloudflare C health','https://asheng-market-bridge.home588885.workers.dev/health')
          assert c.get('ok') and c.get('service')=='asheng-market-bridge','C health/route unavailable'
          q=get('TWSE live fallback',root+'asheng-live-quotes?symbols=4533:otc,2330:tse')
          assert q.get('ok') and isinstance(q.get('quotes'),list),'TWSE MIS source unavailable'
          expected=datetime.datetime.now(ZoneInfo('Asia/Taipei')).strftime('%Y%m%d')
          for item in q['quotes']:
              print('QUOTE',item.get('stock_id'),'date',item.get('quote_date'),
                    'time',item.get('quote_time'),'has_trade',item.get('has_today_trade'),
                    'lots',item.get('volume_lots'),'source',item.get('price_source'))
          valid=[x for x in q['quotes'] if x.get('quote_date')==expected and x.get('has_today_trade')
                 and isinstance(x.get('price'),(int,float)) and x['price']>0]
          print('TODAY_VALID_TRADE_COUNT',len(valid),'OF',len(q['quotes']))
          for symbol in ['4533','2330']:
              a=get('FinMind daily '+symbol,root+'spring-swallow-analyze?symbol='+symbol+'&mode=entry_guard',65)
              print('DAILY',symbol,'as_of',a.get('as_of'),'error',str(a.get('error') or '')[:100])
              assert a.get('ok') and a.get('as_of'),'FinMind historical candle unavailable: '+symbol
          print('RESULT sources accessible; C /quotes itself requires a member admin JWT and is not tested here')
          PY
